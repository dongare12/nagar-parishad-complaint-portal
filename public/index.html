    <!-- Register Complaint -->
    <section class="panel">
      <h2>Register a Complaint</h2>
      <p>Enter the details of your complaint below.</p>

      <form id="complaintForm">

        <label for="name">Full Name</label>
        <input id="name" name="name" type="text"
          placeholder="Enter your full name" required>

        <label for="phone">Mobile Number</label>
        <input id="phone" name="phone" type="tel"
          pattern="[0-9]{10}" maxlength="10"
          placeholder="Enter 10-digit mobile number" required>


        <label for="email">Email Address</label>
<input
  id="email"
  name="email"
  type="email"
  placeholder="Enter your email address"
  required
>


        <label for="category">Complaint Category</label>
        <select id="category" name="category" required>
          <option value="">Select category</option>
          <option value="Street Light">Street Light</option>
          <option value="Water Supply">Water Supply</option>
          <option value="Road">Road Damage</option>
          <option value="Garbage">Garbage Collection</option>
          <option value="Drainage">Drainage</option>
          <option value="Other">Other</option>
        </select>

        <label for="location">Location</label>
        <input id="location" name="location" type="text"
          placeholder="Enter area or street name" required>
          




        <label for="description">Complaint Description</label>
        <textarea id="description" name="description" rows="4"
          placeholder="Describe your problem..." required></textarea>
        <label for="image">Upload Problem Photo</label>
        <input
              id="image"
              name="image"
              type="file"
               accept="image/jpeg,image/png,image/webp"
                           >
        <small>Upload a JPG, PNG, or WebP image (maximum 5 MB).</small>

        <button type="submit">Submit Complaint</button>
        <p id="formMessage" role="status" aria-live="polite"></p>

      </form>
    </section>

   

    <footer>
      <p>Nagar Parishad Complaint Management System</p>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
